name: Vérifier les IDs TMDB

# Pas de "schedule" ici : ce script n'a besoin de tourner que ponctuellement,
# quand tu viens d'ajouter une ou plusieurs séries dans series.json.
on:
  workflow_dispatch: {}

jobs:
  check-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du repository
        uses: actions/checkout@v4

      - name: Vérifier les IDs de series.json
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 check_ids.py
